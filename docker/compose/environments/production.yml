# =============================================================================
# Production: code baked into the image; only storage/ and .env are mounted.
# =============================================================================

services:
  app:
    volumes:
      - '${STORAGE_MOUNT_PATH}:/var/www/html/storage'
      # Mounted so credentials can change without a rebuild (`./dock restart`).
      - '../../.env:/var/www/html/.env:ro'
    deploy:
      resources:
        limits:
          memory: '${APP_MEMORY_LIMIT:-1G}'
