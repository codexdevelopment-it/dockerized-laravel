# =============================================================================
# octane: Laravel Octane on FrankenPHP, HTTP on APP_PORT.
# Requires laravel/octane in composer.json (dock installs it in local if missing).
# The image is built on dunglas/frankenphp for PHP_VERSION (see the Dockerfile),
# so FrankenPHP reads the same php.ini files as the CLI.
# =============================================================================

services:
  app:
    ports:
      - '${DOCK_APP_BIND:-}${APP_PORT:-8000}:8000'
    volumes:
      - '../config/supervisor/server-octane-${DOCK_ENV:-local}.conf:/etc/supervisor/programs/20-server.conf:ro'
