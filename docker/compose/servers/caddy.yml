# =============================================================================
# caddy: php-fpm behind Caddy, automatic HTTPS for DOMAIN.
# =============================================================================

services:
  app:
    volumes:
      - '../config/supervisor/server-fpm.conf:/etc/supervisor/programs/20-server.conf:ro'

  caddy:
    container_name: '${CONTAINER_NAME}-caddy'
    image: 'caddy:${CADDY_VERSION:-2-alpine}'
    restart: '${RESTART_POLICY:-no}'
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - '../config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro'
      - '../../public:/var/www/html/public:ro'
      - '${STORAGE_MOUNT_PATH}:/var/www/html/storage:ro'
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  caddy-data:
  caddy-config:
