# =============================================================================
# fpm: php-fpm only, FastCGI on APP_PORT. Bring your own web server.
# Published on SERVICES_BIND (default 127.0.0.1): an exposed FastCGI port
# lets anyone execute PHP, so never bind it to 0.0.0.0 on a public host.
# =============================================================================

services:
  app:
    ports:
      - '${SERVICES_BIND:-127.0.0.1}:${APP_PORT:-9000}:9000'
    volumes:
      - '../config/supervisor/server-fpm.conf:/etc/supervisor/programs/20-server.conf:ro'
