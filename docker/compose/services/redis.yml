# =============================================================================
# Redis: cache, sessions, queues. Host port is added by ports/redis.yml
# (PUBLISH_REDIS_PORT); the app keeps redis:6379.
# =============================================================================

services:
  redis:
    container_name: '${CONTAINER_NAME}-redis'
    image: 'redis:${REDIS_VERSION:-8-alpine}'
    restart: '${RESTART_POLICY:-no}'
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  redis-data:
