# =============================================================================
# Redis: cache, sessions, queues. Host port bound to SERVICES_BIND (127.0.0.1).
# FORWARD_REDIS_PORT only changes the host side; the app keeps redis:6379.
# =============================================================================

services:
  redis:
    container_name: '${CONTAINER_NAME}-redis'
    image: 'redis:${REDIS_VERSION:-8-alpine}'
    restart: '${RESTART_POLICY:-no}'
    ports:
      - '${SERVICES_BIND:-127.0.0.1}:${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  redis-data:
