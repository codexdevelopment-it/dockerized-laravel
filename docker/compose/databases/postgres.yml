# =============================================================================
# PostgreSQL: base service (no published port, bind-mounted data dir).
# Env overrides: postgres-local.yml / -staging.yml / -production.yml.
# POSTGRES_VERSION is pinned: the data dir is major-locked (major bump = pg_upgrade or dump/restore).
# =============================================================================

services:
  postgres:
    container_name: '${CONTAINER_NAME}-db'
    image: 'postgres:${POSTGRES_VERSION:-16.15}-alpine'
    restart: '${RESTART_POLICY:-no}'
    environment:
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      TZ: '${APP_TIMEZONE:-UTC}'
    volumes:
      - '${DB_MOUNT_PATH}:/var/lib/postgresql/data'
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
