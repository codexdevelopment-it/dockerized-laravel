# =============================================================================
# PostgreSQL + pgvector: base service (no published port, bind-mounted data dir).
# Env overrides: pgvector-local.yml / -staging.yml / -production.yml.
# Same as postgres.yml plus the vector extension. Service/host name stays
# `postgres` so DB_HOST is identical for both drivers. PGVECTOR_VERSION is pinned.
# =============================================================================

services:
  postgres:
    container_name: '${CONTAINER_NAME}-db'
    image: 'pgvector/pgvector:${PGVECTOR_VERSION:-0.8.7-pg17}'
    restart: '${RESTART_POLICY:-no}'
    environment:
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      TZ: '${APP_TIMEZONE:-UTC}'
    volumes:
      - '${DB_MOUNT_PATH}:/var/lib/postgresql/data'
      # Creates the `vector` extension on a fresh data dir.
      - '../config/postgres/pgvector-init.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro'
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
