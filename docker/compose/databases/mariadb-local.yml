# =============================================================================
# mariadb, local: publish the DB port on SERVICES_BIND (default 127.0.0.1) for
# desktop clients (TablePlus, DBeaver, ...). Never on all interfaces by default.
# =============================================================================

services:
  mariadb:
    ports:
      - '${SERVICES_BIND:-127.0.0.1}:${FORWARD_DB_PORT:-3306}:3306'
