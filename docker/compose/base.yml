# =============================================================================
# Base: the app service + shared network.
# Every variable below is exported by `dock` (scripts/lib/env.sh:prepare_compose_env),
# which also normalises DOCK_ENV (local|staging|production) and makes mount
# paths absolute. Relative paths in compose files resolve from docker/compose/.
# =============================================================================

services:
  app:
    container_name: '${CONTAINER_NAME}'
    build:
      context: ../../
      dockerfile: docker/Dockerfile
      target: '${DOCK_ENV:-local}'
      args:
        BUILD_ENV: '${DOCK_ENV:-local}'
        USER_ID: '${USER_ID:-1000}'
        GROUP_ID: '${GROUP_ID:-1000}'
        PHP_VERSION: '${PHP_VERSION:-8.5}'
        NODE_VERSION: '${NODE_VERSION:-24}'
        PHP_EXTENSIONS: '${PHP_EXTENSIONS:-}'
        WITH_FRANKENPHP: '${DOCK_WITH_FRANKENPHP:-0}'
        FRANKENPHP_VERSION: '${FRANKENPHP_VERSION:-1.13.0}'
    image: '${CONTAINER_NAME}:${DOCK_ENV:-local}${DOCK_IMAGE_SUFFIX:-}'
    restart: '${RESTART_POLICY:-no}'
    working_dir: '/var/www/html'
    stop_grace_period: 30s
    environment:
      - APP_ENV=${APP_ENV:-local}
      - CONTAINER_NAME=${CONTAINER_NAME}
      - TZ=${APP_TIMEZONE:-UTC}
    volumes:
      - '../config/fpm/pool.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro'
      # PHP tuning for php-fpm / php-cli. servers/octane.yml mounts the same
      # files for FrankenPHP's embedded PHP.
      - '../config/php/base.ini:/usr/local/etc/php/conf.d/00-base.ini:ro'
      - '../config/php/${DOCK_ENV:-local}.ini:/usr/local/etc/php/conf.d/01-environment.ini:ro'
      # Supervisor: base + per-env workers. The server program is mounted by
      # servers/<SERVER>.yml as 20-server.conf.
      - '../config/supervisor/base.conf:/etc/supervisor/conf.d/00-base.conf:ro'
      - '../config/supervisor/workers-${DOCK_ENV:-local}.conf:/etc/supervisor/programs/10-workers.conf:ro'
    networks:
      - app-network
    healthcheck:
      # Non-zero when any supervised program (server, workers) is not RUNNING.
      test: ['CMD', 'supervisorctl', '-c', '/etc/supervisor/conf.d/00-base.conf', 'status']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  app-network:
    driver: bridge
