# =============================================================================
# postgres / pgvector: host port for desktop clients.
# Added by dock only when PUBLISH_DB_PORT is not false. Bound to SERVICES_BIND
# (default 127.0.0.1); FORWARD_DB_PORT only changes the host side.
# =============================================================================

services:
  postgres:
    ports:
      - '${SERVICES_BIND:-127.0.0.1}:${FORWARD_DB_PORT:-5432}:5432'
