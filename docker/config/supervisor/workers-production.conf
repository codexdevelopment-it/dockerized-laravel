; =============================================================================
; Production workers: queue workers + scheduler. Tune numprocs to your queue load.
; =============================================================================

[program:queue-worker]
command=php /var/www/html/artisan queue:work --tries=3 --timeout=120 --max-jobs=500 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=laravel
autostart=true
autorestart=true
priority=10
startretries=10
stopsignal=SIGTERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; schedule:work runs schedule:run on every minute boundary (no drift).
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=laravel
autostart=true
autorestart=true
priority=20
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
