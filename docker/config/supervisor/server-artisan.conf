; =============================================================================
; artisan serve (SERVER=artisan, dev only). Logs: ./dock logs -f app
; =============================================================================

[program:artisan-serve]
command=php /var/www/html/artisan serve --host=0.0.0.0 --port=8000
user=laravel
autostart=true
autorestart=true
priority=1
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
