name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint (bash -n, shellcheck, compose matrix)
        run: make lint

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [local, staging, production]
    steps:
      - uses: actions/checkout@v4
      - name: Minimal Laravel-like context
        if: matrix.target != 'local'
        run: |
          mkdir -p /tmp/app/bootstrap/cache && cd /tmp/app
          echo '{"require":{}}' > composer.json
          printf '<?php echo "ok";\n' > artisan
      - name: Build ${{ matrix.target }} image
        run: |
          ctx=$([ "${{ matrix.target }}" = local ] && echo . || echo /tmp/app)
          docker build --target ${{ matrix.target }} --build-arg BUILD_ENV=${{ matrix.target }} -f docker/Dockerfile "$ctx"
